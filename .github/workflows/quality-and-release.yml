name: Quality and release

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os, re
          pattern = r'(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9.-]*\))?!?: \S.*'
          if not re.fullmatch(pattern, os.environ['PR_TITLE']):
              raise SystemExit('Use a Conventional Commit PR title, e.g. feat(rules): add a rule')
          PY

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: iconv, mbstring, dom, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer check
      - run: python3 -m unittest discover -s .github/tests
      - name: Verify Composer and Git distribution archives
        run: |
          composer archive --format=zip --dir=build/distribution --file=composer-package --no-interaction
          git archive --format=zip --output=build/distribution/git-package.zip HEAD
          python3 .github/scripts/verify_archive.py build/distribution/composer-package.zip build/distribution/git-package.zip

  release:
    name: Release
    needs: quality
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release prerequisites
        run: |
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA"
          curl --fail --silent --show-error --max-time 30 https://packagist.org/packages/noldors/phpcsfixer-rules.json > /dev/null
      - name: Find a release already made for this commit
        id: version
        run: |
          existing=$(git tag --points-at "$GITHUB_SHA" --list 'v[0-9]*' | sort -V | tail -n 1)
          echo "existing=$existing" >> "$GITHUB_OUTPUT"
          if ! git tag --list 'v[0-9]*' | grep -q .; then
            echo 'initial=0.0.1' >> "$GITHUB_OUTPUT"
          fi
      - name: Create the next immutable SemVer tag
        id: tag
        if: steps.version.outputs.existing == ''
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_sha: ${{ github.sha }}
          release_branches: ^master$
          tag_prefix: v
          custom_tag: ${{ steps.version.outputs.initial }}
          default_bump: patch
          commit_analyzer_preset: conventionalcommits
          force_update: false
      - name: Verify the commit indexed by the Packagist webhook
        env:
          RELEASE_TAG: ${{ steps.version.outputs.existing || steps.tag.outputs.new_tag }}
        run: |
          : "${RELEASE_TAG:?No release tag was produced}"
          python3 .github/scripts/packagist.py
